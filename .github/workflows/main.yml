name: Build Packages

# 触发条件
on:
  workflow_dispatch:        # 支持在 GitHub Actions 页面手动触发

jobs:
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.sdk }}
    runs-on: ubuntu-latest 

    strategy:
      fail-fast: false      # 某个矩阵任务失败后，不中断其他任务，继续跑完所有组合
      matrix:
        arch:
          - x86_64               # x86 64位，软路由（如 PC、N100 等）
          # - aarch64_cortex-a53   # ARM 64位，NanoPi R2S（RK3328）
          # - mipsel_24kc          # MIPS 小端，极路由B70 / 新三路由（MT7621）
        sdk:
          - openwrt-25.12    

    steps:
      # 分支检查，只允许在 dev 分支上构建
      - name: Check branch
        if: github.ref_name != 'dev'
        run: |
          echo "只能在dev分支上构建"
          exit 1
      
      # Step 1：检出当前仓库代码
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2：构建 OpenWrt 软件包
      - name: Build packages
        uses: sbwml/openwrt-gh-action-sdk@go1.25
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          PACKAGES: luci-app-wizard
          NO_REFRESH_CHECK: true

      # Step 3：将构建产物上传为 GitHub Actions Artifact
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-${{ matrix.sdk }}
          path: |
            bin/packages/${{ matrix.arch }}/packages_ci/*.apk
            bin/packages/${{ matrix.arch }}/packages_ci/*.ipk

      # Step 4：将构建产物打包为 .tar.gz
      - name: Create release archive
        run: |
          tar -zcvf luci-app-wizard_${{ matrix.sdk }}-${{ matrix.arch }}.tar.gz \
            -C bin/packages/${{ matrix.arch }}/ packages_ci

      # Step 5：上传到 GitHub Release
      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          name: luci-app-wizard
          tag: latest
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          prerelease: false
          artifacts: "luci-app-wizard_${{ matrix.sdk }}-${{ matrix.arch }}.tar.gz"