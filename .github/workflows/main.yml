name: Test Build

on:
  pull_request:
    branches:
      - main   # 当 PR 目标分支是 main 时触发构建
  
  workflow_dispatch:   # ✅ 允许 GitHub 手动点击 Run workflow

jobs:
  build:
    name: ${{ matrix.arch }} build  # job 名称会显示当前构建架构
    runs-on: ubuntu-latest          # 使用 GitHub 提供的 Ubuntu runner

    strategy:
      matrix:
        arch:
          - x86_64-openwrt-25.12.0-rc2     # 第一种构建目标架构：x86 64位
         # - mips_24kc-25.12.0-rc1  # 第二种构建目标架构：MIPS 24kc（路由器常见）

    steps:
      # 1️⃣ 拉取代码
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0   # 拉取完整 git 历史（避免浅克隆问题）

      # 2️⃣ 编译 OpenWrt/ImmortalWrt package
      - name: Build
        uses: immortalwrt/gh-action-sdk@master
        env:
          ARCH: ${{ matrix.arch }}
          # 指定当前构建架构
          # 实际会触发 SDK 容器构建对应平台的 package

      # 3️⃣ 上传编译产物
      - name: Store packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch}}-packages
          # artifact 名称，例如：
          # x86_64-packages / mips_24kc-packages

          path: bin/packages/${{ matrix.arch }}/packages/*.apk


